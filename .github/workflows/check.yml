name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    # 每两小时运行一次，并避开整点高峰。
    - cron: "17 */2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 检测 Worker 使用仓库 Secret 认证，令牌不会写入代码。
          CHECK_WORKER: "https://sstp-check.sping82085410.workers.dev/check?token=${{ secrets.CHECK_TOKEN }}&sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "16"
          CHECK_TIMEOUT: "90"
          NODES_URL: "https://haynesbritneym3i8thh-lang.github.io/gate/nodes.txt"
          # 同时获取电信、联通和移动入口，每个来源只取少量地址。
          OPTIMAL_API: "https://cf.090227.xyz/ct?ips=4&port=443,https://cf.090227.xyz/cu?ips=4&port=443,https://cf.090227.xyz/cmcc?ips=4&port=443"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://haynesbritneym3i8thh-lang.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
